<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>J-Athlete | Team</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="phone-shell">
    <header class="page-header">
      <a href="dashboard.html" class="back-link">← Dashboard</a>
      <h1>Join a Team</h1>
      <p id="current-user"></p>
    </header>

    <section class="panel">
      <form id="team-form" class="form-grid">
        <label>Team Name
          <input type="text" id="team-name" placeholder="Sunrise Racers" required />
        </label>
        <button type="submit" class="btn">Join Team</button>
      </form>
      <p id="team-status" aria-live="polite"></p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
