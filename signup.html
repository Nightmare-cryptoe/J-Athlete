<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>J-Athlete | Sign Up</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="phone-shell">
    <header class="page-header">
      <a href="index.html" class="back-link">← Back</a>
      <h1>Sign Up</h1>
      <p id="current-user"></p>
    </header>

    <section class="panel">
      <form id="signup-form" class="form-grid">
        <label>Username
          <input type="text" id="signup-username" required minlength="3" autocomplete="username" />
        </label>
        <label>Email (optional)
          <input type="email" id="signup-email" />
        </label>
        <label>Password
          <input type="password" id="signup-password" required minlength="6" autocomplete="new-password" />
        </label>
        <label>Confirm Password
          <input type="password" id="signup-confirm-password" required minlength="6" autocomplete="new-password" />
        </label>
        <label>Display Name
          <input type="text" id="signup-display-name" required />
        </label>
        <label>Skill Level
          <select id="signup-skill-level" required>
            <option value="Beginner">Beginner</option>
            <option value="Intermediate">Intermediate</option>
            <option value="Advanced">Advanced</option>
            <option value="Elite">Elite</option>
          </select>
        </label>
        <button type="submit" class="btn">Create Account</button>
      </form>
      <p id="signup-status" aria-live="polite"></p>
      <a class="text-link" href="dashboard.html">Go to dashboard</a>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
